name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Build PHP runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: a2a-php-sdk-dev:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Match workspace permissions
        run: |
          echo "SDK_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "SDK_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: make install
      - name: Tests, static analysis, style and generated contracts
        run: make verify
      - name: Check dependencies for known vulnerabilities
        run: docker compose run --rm php composer audit
      - name: Build and install the package in a clean project
        run: make package
      - name: Check official TCK baseline and isolated upstream correction
        run: make tck-check
      - name: Save TCK reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tck-reports
          path: var/tck-ci.*/**
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified Composer package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composer-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14
